name: Refresh Regulations.gov comments

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulations-comment-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch and merge changed comments
        env:
          REGULATIONS_API_KEY: ${{ secrets.REGULATIONS_API_KEY }}
        run: python scripts/update-comments.py

      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "No public-record changes"
            exit 0
          fi
          git config user.name "cms-comment-monitor[bot]"
          git config user.email "cms-comment-monitor[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "chore(data): refresh regulations comments"
          git pull --rebase origin main
          git push origin HEAD:main
